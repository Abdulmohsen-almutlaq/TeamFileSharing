version: "3.9"

services:

  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # AUTO RUN SQL FILE

  app:
    build: .
    container_name: java_app
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASS: apppassword
    volumes:
      - ./storage:/app/storage
    ports:
      - "8080:8080"

volumes:
  postgres_data:
